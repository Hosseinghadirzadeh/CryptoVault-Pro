[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptovault"
version = "1.0.0"
description = "Educational desktop application for authenticated hybrid encryption"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "cryptography>=43.0",
  "argon2-cffi>=23.1",
  "blake3>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cryptovault = "cryptovault.app:main"
cryptovault-cli = "cryptovault.cli:main"

[tool.setuptools.packages.find]
include = ["cryptovault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
